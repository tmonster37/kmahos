name: Hospital Platform CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-test:
    name: Backend Unit & Security Tests (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hospital-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Test Suite
        run: ./mvnw test -B

  frontend-test-and-build:
    name: Frontend Vitest & Vite Build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hospital-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Vitest unit tests
        run: npx vitest run

      - name: Build production bundle
        run: npx vite build

