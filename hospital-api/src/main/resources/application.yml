server:
  port: 8080

spring:
  application:
    name: hospital-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kmahos}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:taizz0537}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 180000
      max-lifetime: 600000
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_FORMAT_SQL:true}
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      fail-on-empty-beans: false
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 1 ngày (mili-giây)

google:
  client-id: ${GOOGLE_CLIENT_ID:1038814592004-8fua2p0vpn2988932qe6jnhef73drop2.apps.googleusercontent.com}
  allow-mock-token: ${GOOGLE_ALLOW_MOCK_TOKEN:false}

otp:
  expiration-ms: ${OTP_EXPIRATION_MS:300000} # 5 phút
  max-attempts: ${OTP_MAX_ATTEMPTS:5}
  resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN:60}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:3001,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:3000,http://127.0.0.1:3001,https://hospital.kma.edu.vn,https://kiosk.hospital.kma.edu.vn,https://admin.hospital.kma.edu.vn}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:P48XA8RI}
  hash-secret: ${VNPAY_HASH_SECRET:BRYEEDJIJFAGUSDLEPIOPDMDYEMLDCAX}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/payment/vnpay/callback}

payos:
  client-id: ${PAYOS_CLIENT_ID:demo-client-id}
  api-key: ${PAYOS_API_KEY:demo-api-key}
  checksum-key: ${PAYOS_CHECKSUM_KEY:demo-checksum-key}
  bank-bin: ${PAYOS_BANK_BIN:MB}
  bank-name: ${PAYOS_BANK_NAME:MBBank - Ngân hàng TMCP Quân Đội}
  bank-account: ${PAYOS_BANK_ACCOUNT:0987654321}
  account-holder: ${PAYOS_ACCOUNT_HOLDER:BENH VIEN DA KHOA QUOC TE TNT}
  return-url: ${PAYOS_RETURN_URL:http://localhost:3000/payment}
  cancel-url: ${PAYOS_CANCEL_URL:http://localhost:3000/payment}

---
# Cấu hình an toàn dành riêng cho môi trường Production
spring:
  config:
    activate:
      on-profile: prod,production
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: ${JWT_SECRET}

google:
  allow-mock-token: false

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    com.hospital.api: INFO
